- name: Install MetalLB
  hosts: controller
  become: yes
  vars:
    metallb_version: "v0.14.9"
  tasks:
    - name: Download MetalLB v{{ metallb_version }} manifest
      get_url:
        url: https://raw.githubusercontent.com/metallb/metallb/v0.14.9/config/manifests/metallb-native.yaml
        dest: "/tmp/metallb-native.yaml"
        mode: '0644'
      become_user: vagrant

    - name: Apply MetalLB CRDs & core components
      shell: kubectl apply --validate=false -f /tmp/metallb-native.yaml
      become_user: vagrant


    - name: Remove the control-plane NoSchedule taint so MetalLB can schedule
      shell: |
        kubectl taint nodes ctrl node-role.kubernetes.io/control-plane:NoSchedule- || true
      become_user: vagrant

    - name: Remove the master NoSchedule taint (if present)
      shell: |
        kubectl taint nodes ctrl node-role.kubernetes.io/master:NoSchedule- || true
      become_user: vagrant

    - name: Wait until any MetalLB pod shows up
      shell: kubectl get pods -n metallb-system
      register: metallb_pods
      retries: 12
      delay: 10
      become_user: vagrant
      until: metallb_pods.stdout_lines | length > 0

    - name: Wait for all MetalLB pods to be ready
      shell: kubectl wait --for=condition=ready pod --all \
        -n metallb-system --timeout=180s
      args:
        executable: /bin/bash
      become_user: vagrant

    - name: Write MetalLB IPAddressPool manifest
      copy:
        dest: /tmp/metallb-pool.yaml
        mode: '0644'
        content: |
          apiVersion: metallb.io/v1beta1
          kind: IPAddressPool
          metadata:
            name: default
            namespace: metallb-system
          spec:
            addresses:
              - 192.168.56.90-192.168.56.99

    - name: Apply MetalLB IPAddressPool
      shell: kubectl apply -f /tmp/metallb-pool.yaml
      become_user: vagrant

    - name: Write MetalLB L2Advertisement manifest
      copy:
        dest: /tmp/metallb-l2adv.yaml
        mode: '0644'
        content: |
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata:
            name: default
            namespace: metallb-system
          spec:
            ipAddressPools:
              - default

    - name: Apply MetalLB L2Advertisement
      shell: kubectl apply -f /tmp/metallb-l2adv.yaml
      become_user: vagrant

- name: Install NGINX Ingress Controller
  hosts: ctrl
  become: yes
  vars:
    ingress_namespace: ingress-nginx
    ingress_release: ingress-nginx
  tasks:
    - name: Add ingress-nginx Helm repository
      shell: |
        helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
        helm repo update
      args:
        executable: /bin/bash
      become_user: vagrant

    - name: Deploy or upgrade NGINX Ingress Controller via Helm
      shell: |
        helm upgrade --install {{ ingress_release }} ingress-nginx/ingress-nginx \
          --namespace {{ ingress_namespace }} --create-namespace \
          --set controller.service.loadBalancerIP={{ ingress_loadbalancer_ip | default('192.168.56.95') }} \
          --wait
      args:
        executable: /bin/bash
      become_user: vagrant

    - name: Wait for Ingress Controller to be ready
      shell: kubectl wait --for=condition=ready pod --all \
        -n {{ ingress_namespace }} --timeout=180s
      args:
        executable: /bin/bash
      become_user: vagrant

    - name: Verify Ingress Service has an external IP
      shell: kubectl -n {{ ingress_namespace }} get svc {{ ingress_release }}-controller -o wide
      register: ingress_svc
      become_user: vagrant

    - name: Show Ingress Service IP
      debug:
        var: ingress_svc.stdout_lines

- name: Install Kubernetes Dashboard
  hosts: ctrl
  become: yes
  vars:
    dashboard_namespace: kubernetes-dashboard
    dashboard_release: kubernetes-dashboard
    ingress_host: dashboard.local
  tasks:
    - name: Add kubernetes-dashboard Helm repo
      shell: |
        helm repo add kubernetes-dashboard https://kubernetes.github.io/dashboard/
        helm repo update
      args:
        executable: /bin/bash
      become_user: vagrant

    - name: Install or upgrade Kubernetes Dashboard
      shell: |
        helm upgrade --install {{ dashboard_release }} kubernetes-dashboard/kubernetes-dashboard \
          --namespace {{ dashboard_namespace }} --create-namespace \
      args:
        executable: /bin/bash
      become_user: vagrant

    - name: Wait for dashboard pods to be ready
      shell: |
        kubectl wait --for=condition=ready pod --all -n {{ dashboard_namespace }} --timeout=300s
      args:
        executable: /bin/bash
      become_user: vagrant
      retries: 3
      delay: 10
      register: dashboard_wait_result
      until: dashboard_wait_result is succeeded

    - name: Write Dashboard admin-user SA & ClusterRoleBinding manifest
      copy:
        dest: /tmp/dashboard-adminuser.yaml
        mode: '0644'
        content: |
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: admin-user
            namespace: {{ dashboard_namespace }}
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: admin-user
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cluster-admin
          subjects:
            - kind: ServiceAccount
              name: admin-user
              namespace: {{ dashboard_namespace }}

    - name: Apply admin-user SA & ClusterRoleBinding
      shell: kubectl apply -f /tmp/dashboard-adminuser.yaml
      become_user: vagrant

    - name: Write Dashboard Ingress manifest
      copy:
        dest: /tmp/dashboard-ingress.yaml
        mode: '0644'
        content: |
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: kubernetes-dashboard
            namespace: {{ dashboard_namespace }}
            annotations:
              nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
          spec:
            ingressClassName: nginx
            rules:
              - host: {{ ingress_host }}
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: kubernetes-dashboard
                          port:
                            number: 443

    - name: Apply Dashboard Ingress
      shell: kubectl apply -f /tmp/dashboard-ingress.yaml
      become_user: vagrant

    - name: Point Dashboard Ingress at kubernetes-dashboard-kong-proxy
      shell: |
        kubectl -n kubernetes-dashboard patch ingress kubernetes-dashboard \
          --type=json -p '[{
            "op": "replace",
            "path": "/spec/rules/0/http/paths/0/backend/service/name",
            "value": "kubernetes-dashboard-kong-proxy"
          }]'
      become_user: vagrant

    - name: Verify Dashboard Ingress is created
      shell: kubectl get ingress kubernetes-dashboard -n kubernetes-dashboard
      register: dashboard_ingress
      become_user: vagrant

    - name: Show Dashboard Ingress status
      debug:
        var: dashboard_ingress.stdout_lines

    - name: Dashboard setup complete
      debug:
        msg: |
          The Kubernetes Dashboard is installed in namespace "{{ dashboard_namespace }}".
          To log in, run on the controller VM:

            kubectl -n {{ dashboard_namespace }} create token admin-user

          Then add this entry to your /etc/hosts so you can browse via HTTPS:

            192.168.56.95  {{ ingress_host }}

          Finally, open https://{{ ingress_host }}/ in your browser and paste the token to log in.

- name: Install Istio
  hosts: ctrl
  become: yes
  tasks:
    - name: Install Istio into the cluster
      shell: istioctl install -y -f /vagrant/istio-operator.yaml
      become_user: vagrant

    - name: Wait for Istio pods to be ready
      shell: kubectl wait --for=condition=ready pod --all -n istio-system --timeout=180s
      args:
        executable: /bin/bash
      become_user: vagrant

    - name: Get Istio Ingress Gateway IP
      shell: kubectl get svc istio-ingressgateway -n istio-system -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
      register: istio_gateway_ip
      become_user: vagrant

    - name: Show Istio Gateway IP
      debug:
        msg: |
          Istio has been successfully installed!
          Istio Ingress Gateway IP: {{ istio_gateway_ip.stdout }}
          
          You can now use Istio Gateway and VirtualService resources for traffic management.

    - name: Install Istio Prometheus addon
      shell: |
        kubectl apply -f /home/vagrant/istio-1.25.2/samples/addons/prometheus.yaml
      become_user: vagrant

    - name: Install Istio Jaeger addon
      shell: |
        kubectl apply -f /home/vagrant/istio-1.25.2/samples/addons/jaeger.yaml
      become_user: vagrant

    - name: Install Istio Kiali addon
      shell: |
        kubectl apply -f /home/vagrant/istio-1.25.2/samples/addons/kiali.yaml
      become_user: vagrant

    - name: Enable Istio injection on default namespace
      shell: |  
        kubectl label namespace default istio-injection=enabled
      become_user: vagrant

- name: Final Verification
  hosts: ctrl
  become: yes
  tasks:
    - name: Verify all LoadBalancer services have external IPs
      shell: kubectl get svc --all-namespaces | grep LoadBalancer
      register: lb_services
      become_user: vagrant

    - name: Show LoadBalancer services
      debug:
        var: lb_services.stdout_lines

    - name: Verify MetalLB is working
      shell: kubectl get pods -n metallb-system
      register: metallb_status
      become_user: vagrant

    - name: Show MetalLB status
      debug:
        var: metallb_status.stdout_lines

    - name: Verify Nginx Ingress is working
      shell: kubectl get pods -n ingress-nginx
      register: nginx_status
      become_user: vagrant

    - name: Show Nginx Ingress status
      debug:
        var: nginx_status.stdout_lines

    - name: Verify Istio is working
      shell: kubectl get pods -n istio-system
      register: istio_status
      become_user: vagrant

    - name: Show Istio status
      debug:
        var: istio_status.stdout_lines

    - name: Verify Dashboard is working
      shell: kubectl get pods -n kubernetes-dashboard
      register: dashboard_status
      become_user: vagrant

    - name: Show Dashboard status
      debug:
        var: dashboard_status.stdout_lines

    - name: Final success message
      debug:
        msg: |
          
          Your Kubernetes cluster is now fully configured with:
          
          * MetalLB providing fixed IPs (192.168.56.90-192.168.56.99)
          * Nginx Ingress Controller with fixed IP (192.168.56.95)
          * Istio Gateway with fixed IP (192.168.56.90)
          * Kubernetes Dashboard accessible via https://dashboard.local
          * HTTPS Ingress Controller with self-signed certificates
          
          All components are ready for production workloads.
          
          To access the dashboard:
          1. Add to /etc/hosts: 192.168.56.95 dashboard.local
          2. Run: kubectl -n kubernetes-dashboard create token admin-user
          3. Visit: https://dashboard.local
