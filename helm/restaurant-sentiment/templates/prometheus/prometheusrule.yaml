apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-alerts
  namespace: {{ .Values.prometheus.namespace | default "monitoring" }}
spec:
  groups:
  - name: app.rules
    rules:
    - alert: HighRequestRate
      expr: rate(sentiment_app_requests_total[1m]) > 15
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "High request rate detected"