apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-test-alert
  namespace: {{ .Values.prometheus.namespace | default "monitoring" }}
spec:
  groups:
    - name: test.rules
      rules:
        - alert: TestAlert
          expr: vector(1)       # always true
          for: 10s              # fires if true for 10 seconds
          labels:
            severity: critical
          annotations:
            summary: "This is a test alert"
            description: "This alert fires immediately for testing."
