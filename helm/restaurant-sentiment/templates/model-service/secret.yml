apiVersion: v1
kind: Secret
metadata:
  name: {{ include "restaurant-sentiment.fullname" . }}-model-secret
  labels:
    app.kubernetes.io/name: {{ include "restaurant-sentiment.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: model
type: Opaque
data:
  # API authentication for model service
  API_KEY: {{ .Values.modelService.apiKey | default "dGhpc0lzVGhlU2VjcmV0" | b64enc }}  # thisIsTheSecret (base64 encoded)
  
  # Model download credentials (if needed)
  MODEL_DOWNLOAD_TOKEN: {{ .Values.modelService.modelDownloadToken | default "Z2l0aHViX3Rva2VuX2Zvcl9tb2RlbF9kb3dubG9hZA==" | b64enc }} 
  
  # Model encryption key (if models are encrypted)
  MODEL_ENCRYPTION_KEY: {{ .Values.modelService.modelEncryptionKey | default "bW9kZWxfZW5jcnlwdGlvbl9rZXlfMjAyNA==" | b64enc }}