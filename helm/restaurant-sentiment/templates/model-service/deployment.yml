apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "restaurant-sentiment.fullname" . }}-model
  labels:
    app.kubernetes.io/name: {{ include "restaurant-sentiment.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: model
spec:
  replicas: {{ .Values.modelService.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "restaurant-sentiment.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: model
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "restaurant-sentiment.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: model
    spec:
      containers:
        - name: model-service
          image: {{ .Values.modelService.image }}
          imagePullPolicy: {{ .Values.modelService.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.modelService.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "restaurant-sentiment.fullname" . }}-model-env-config
            - secretRef:
                name: {{ include "restaurant-sentiment.fullname" . }}-model-secret
          volumeMounts:
            - name: shared-volume
              mountPath: /vagrant/shared
            - name: model-credentials
              mountPath: /run/secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false 
      volumes:
        - name: shared-volume
          hostPath:
            path: {{ .Values.sharedVolumePath }}
            type: Directory
        - name: model-credentials
          secret:
            secretName: restaurant-sentiment-shared-secret
            items:
              - key: model_credentials
                path: model_credentials
