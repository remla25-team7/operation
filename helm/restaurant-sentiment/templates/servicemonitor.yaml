{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sentiment-app-monitor
  labels:
    release: prometheus
    team: restaurant-sentiment
spec:
  selector:
    matchLabels:
      app: sentiment-app
  namespaceSelector:
    any: true
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.scrapeInterval | default "15s" }}
      scheme: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.modelService.name }}-monitor
  labels:
    release: prometheus
    team: restaurant-sentiment
spec:
  selector:
    matchLabels:
      app: {{ .Values.modelService.name }}
  namespaceSelector:
    any: true
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.scrapeInterval | default "15s" }}
      scheme: http
{{- end }}
