apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "restaurant-sentiment.fullname" . }}-test-secrets"
  labels:
    app.kubernetes.io/name: {{ include "restaurant-sentiment.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
spec:
  serviceAccountName: {{ include "restaurant-sentiment.fullname" . }}-test-sa
  containers:
    - name: test-secrets
      image: bitnami/kubectl:latest
      command:
        - /bin/bash
        - -c
        - |
          echo "Testing Secret creation and keys..."
          
          # Test app Secret
          echo "Checking app Secret..."
          kubectl get secret {{ include "restaurant-sentiment.fullname" . }}-app-secret
          if [ $? -eq 0 ]; then
            echo "App Secret exists"
            
            # Check that required keys exist
            kubectl get secret {{ include "restaurant-sentiment.fullname" . }}-app-secret -o jsonpath='{.data.API_KEY}' > /dev/null
            if [ $? -eq 0 ]; then
              echo "App Secret contains API_KEY"
            else
              echo "App Secret missing API_KEY"
              exit 1
            fi
            
            kubectl get secret {{ include "restaurant-sentiment.fullname" . }}-app-secret -o jsonpath='{.data.MODEL_SERVICE_API_KEY}' > /dev/null
            if [ $? -eq 0 ]; then
              echo "App Secret contains MODEL_SERVICE_API_KEY"
            else
              echo "App Secret missing MODEL_SERVICE_API_KEY"
              exit 1
            fi
          else
            echo "App Secret does not exist"
            exit 1
          fi
          
          # Test model Secret
          echo "Checking model Secret..."
          kubectl get secret {{ include "restaurant-sentiment.fullname" . }}-model-secret
          if [ $? -eq 0 ]; then
            echo "Model Secret exists"
            
            # Check that required keys exist
            kubectl get secret {{ include "restaurant-sentiment.fullname" . }}-model-secret -o jsonpath='{.data.API_KEY}' > /dev/null
            if [ $? -eq 0 ]; then
              echo "Model Secret contains API_KEY"
            else
              echo "Model Secret missing API_KEY"
              exit 1
            fi
          else
            echo "Model Secret does not exist"
            exit 1
          fi
          
          echo "All Secret tests passed!"
  restartPolicy: Never 