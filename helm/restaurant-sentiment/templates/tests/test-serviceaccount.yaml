apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "restaurant-sentiment.fullname" . }}-test-sa
  labels:
    app.kubernetes.io/name: {{ include "restaurant-sentiment.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "restaurant-sentiment.fullname" . }}-test-role
  labels:
    app.kubernetes.io/name: {{ include "restaurant-sentiment.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "restaurant-sentiment.fullname" . }}-test-rolebinding
  labels:
    app.kubernetes.io/name: {{ include "restaurant-sentiment.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "restaurant-sentiment.fullname" . }}-test-role
subjects:
  - kind: ServiceAccount
    name: {{ include "restaurant-sentiment.fullname" . }}-test-sa
    namespace: {{ .Release.Namespace }} 