apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "restaurant-sentiment.fullname" . }}-test-sentiment-api"
  labels:
    app.kubernetes.io/name: {{ include "restaurant-sentiment.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: test-sentiment-api
      image: curlimages/curl:latest
      command:
        - /bin/sh
        - -c
        - |
          echo "Testing sentiment analysis API..."
          
          # Test model service prediction endpoint
          echo "Testing model service /predict endpoint..."
          RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"review": "This restaurant is amazing! The food is delicious and the service is excellent."}' \
            http://{{ include "restaurant-sentiment.fullname" . }}-model:{{ .Values.modelService.port }}/predict)
          
          if [ $? -eq 0 ]; then
            echo "Model service /predict endpoint is accessible"
            echo "Response: $RESPONSE"
            
            # Check if response contains expected fields
            if echo "$RESPONSE" | grep -q "sentiment"; then
              echo "Response contains sentiment field"
            else
              echo "Response missing sentiment field"
              exit 1
            fi
          else
            echo "Model service /predict endpoint failed"
            exit 1
          fi
          
          # Test app service web interface
          echo "Testing app service web interface..."
          APP_RESPONSE=$(curl -s http://{{ include "restaurant-sentiment.fullname" . }}-app:{{ .Values.app.port }}/)
          
          if [ $? -eq 0 ]; then
            echo "App service web interface is accessible"
            
            # Check if it's an HTML response
            if echo "$APP_RESPONSE" | grep -q "<!DOCTYPE html>"; then
              echo "App service returns HTML content"
            else
              echo "App service does not return HTML content"
              exit 1
            fi
          else
            echo "App service web interface failed"
            exit 1
          fi
          
          echo "All sentiment API tests passed!"
  restartPolicy: Never 