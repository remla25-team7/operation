apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "restaurant-sentiment.fullname" . }}-ingress
  labels:
    app.kubernetes.io/name: {{ include "restaurant-sentiment.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.app.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "restaurant-sentiment.fullname" . }}-app
                port:
                  number: {{ .Values.app.port }}
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: {{ include "restaurant-sentiment.fullname" . }}-app
                port:
                  number: {{ .Values.app.port }}
