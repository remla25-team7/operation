apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "restaurant-sentiment.fullname" . }}-model-service
spec:
  hosts:
    - {{ include "restaurant-sentiment.fullname" . }}-model
  http:
    - match:
        - sourceLabels:
            app.kubernetes.io/version: v1
      route:
        - destination:
            host: {{ include "restaurant-sentiment.fullname" . }}-model
            subset: v1
    - match:
        - sourceLabels:
            app.kubernetes.io/version: v2
      route:
        - destination:
            host: {{ include "restaurant-sentiment.fullname" . }}-model
            subset: v2
    - route:
        - destination:
            host: {{ include "restaurant-sentiment.fullname" . }}-model
            subset: v1
