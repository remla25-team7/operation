apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ include "restaurant-sentiment.fullname" . }}-model-dr
spec:
  host: {{ include "restaurant-sentiment.fullname" . }}-model
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2