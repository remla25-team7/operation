apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ include "restaurant-sentiment.fullname" . }}-model-dr
spec:
  host: {{ include "restaurant-sentiment.fullname" . }}-model
  trafficPolicy:
    loadBalancer:
      consistentHash:
        httpHeaderName: X-User-ID
  subsets:
    - name: v1
      labels:
        app.kubernetes.io/version: v1
    - name: v2
      labels:
        app.kubernetes.io/version: v2
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ include "restaurant-sentiment.fullname" . }}-model-v2-dr
spec:
  host: {{ include "restaurant-sentiment.fullname" . }}-model-v2
  subsets:
    - name: v2
      labels:
        app.kubernetes.io/version: v2 