{{- if .Values.trafficManagement.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ include "restaurant-sentiment.fullname" . }}-app-dr
spec:
  host: {{ include "restaurant-sentiment.fullname" . }}-app
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2 
{{- end }}