apiVersion: v1
kind: Secret
metadata:
  name: {{ include "restaurant-sentiment.fullname" . }}-app-secret
  labels:
    app.kubernetes.io/name: {{ include "restaurant-sentiment.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: app
type: Opaque
data:
  # API authentication - for now all fake
  API_KEY: {{ .Values.app.apiKey | default "cmVzdGF1cmFudF9zZW50aW1lbnRfYXBpX2tleQ==" | b64enc }}  # restaurant_sentiment_api_key
  MODEL_SERVICE_API_KEY: {{ .Values.app.modelServiceApiKey | default "bW9kZWxfc2VydmljZV9hcGlfa2V5" | b64enc }}  # model_service_api_key
  
  # Database credentials (if needed in future)
  DB_PASSWORD: {{ .Values.app.dbPassword | default "c2VjdXJlX2RiX3Bhc3N3b3Jk" | b64enc }}  # secure_db_password
  
  # External service credentials - for now fake
  EXTERNAL_API_SECRET: {{ .Values.app.externalApiSecret | default "ZXh0ZXJuYWxfYXBpX3NlY3JldA==" | b64enc }}  # external_api_secret 