app:
  image: ghcr.io/remla25-team7/app:latest
  imagePullPolicy: Always
  port: 5001
  host: app.local
  name: sentiment-app
  version: "latest"
  environment: "production"
  logLevel: "info"
  replicas: 1

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  # Secrets configuration
  apiKey: "restaurant_sentiment_api_key_2024"
  modelServiceApiKey: "model_service_api_key"
  dbPassword: "secure_db_password_2024"
  externalApiSecret: "external_api_secret_key"


modelService:
  image: ghcr.io/remla25-team7/model-service:latest
  imagePullPolicy: Always
  port: 5000
  host: model.local
  name: sentiment-model
  modelVersion: "latest"
  environment: "production"
  logLevel: "info"
  replicas: 1
  secret:
    modelCredentials: "thisIsTheSecret="

  modelUrl: "https://github.com/remla25-team7/model-training/releases/latest/download/model.pkl"
  vectorizerUrl: "https://github.com/remla25-team7/model-training/releases/latest/download/vectorizer.pkl"

  apiTimeout: "30"
  maxRequestSize: "16MB"

  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  apiKey: "thisIsTheSecret"
  modelDownloadToken: "github_token_for_model_download"
  modelEncryptionKey: "model_encryption_key_2024"

monitoring:
  enabled: true
  scrapeInterval: 15s
  appRequestRateThreshold: 15
  appRequestRateDuration: 2m

alertmanager:
  enabled: true
  fullname: kube-prometheus-stack
  email:
    to: 'to-mail@gmail.com'
    from: 'from-mail@gmail.com'
    smarthost: 'smtp.gmail.com:587'
    authUsername: 'from-mail@gmail.com'
    requireTLS: true

sharedVolumePath: /vagrant/shared
